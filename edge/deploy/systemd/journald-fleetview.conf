# /etc/systemd/journald.conf.d/fleetview.conf
#
# Agent menulis log terstruktur JSON ke journald. Tanpa batas, journal akan
# tumbuh sampai memakan disk yang seharusnya menampung 30 hari outbox — dan
# kehabisan disk berarti akuisisi berhenti.

[Journal]
Storage=persistent
# Log harus selamat dari reboot: penyebab paling menarik untuk diselidiki justru
# ada tepat sebelum perangkat mati.
SystemMaxUse=500M
SystemMaxFileSize=50M
# Simpan minimal 14 hari; kunjungan teknisi ke kapal jarang.
MaxRetentionSec=14day
# Tanpa rate limit, satu adapter yang gagal berulang bisa menenggelamkan
# seluruh log. Dengan rate limit, pesan yang hilang tetap dihitung dan
# dilaporkan journald.
RateLimitIntervalSec=30s
RateLimitBurst=1000
ForwardToSyslog=no
