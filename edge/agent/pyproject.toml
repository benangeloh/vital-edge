[project]
name = "fleetview-edge-agent"
version = "0.1.0"
description = "FleetView Edge Agent — berjalan di Raspberry Pi di setiap kapal"
requires-python = ">=3.11"
dependencies = [
    "fleetview-contracts",
    "fleetview-common",
    "fleetview-edge-console",
    "pydantic-settings>=2.11",
    "pyyaml>=6.0",
    "uvicorn>=0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetview_edge"]

[project.scripts]
fleetview-edge = "fleetview_edge.__main__:main"
