# Contoh konfigurasi Edge Agent.
#
# Satu build agent yang sama dideploy ke 70+ kapal. Berkas inilah satu-satunya
# yang membedakan mereka. Salin ke /etc/fleetview/edge.yaml lalu sesuaikan.
#
# Setiap nilai bisa ditimpa environment variable berawalan FLEETVIEW_ dengan
# pemisah bertingkat `__`, misalnya:
#   FLEETVIEW_SHIP__SHIP_NAME="KM Sinar Jaya"
#   FLEETVIEW_STORAGE__INFLUX_TOKEN="..."   <- rahasia lewat env, bukan lewat file

environment: production
log_level: INFO
log_format: json
config_version: "cfg-2026-08-31-1"

# Wajib. Tidak ada default — agent menolak start bila bagian ini kosong,
# supaya tidak ada kapal yang mengirim data atas nama kapal lain.
ship:
  ship_id: "00000000-0000-0000-0000-000000000000"
  ship_name: "GANTI DENGAN NAMA KAPAL"
  device_id: "00000000-0000-0000-0000-000000000000"

collector:
  # Adapter perangkat lapangan.
  #   lp_a104   -> perangkat sungguhan. BELUM BISA DIPAKAI: jalur baca dari
  #                LP-A104 belum terkonfirmasi. Adapter-nya sengaja gagal keras
  #                dengan pesan yang menjelaskan, bukan diam-diam mengembalikan
  #                kosong. Lihat docs/hardware/LP-A104.md.
  #   simulator -> profil mesin kapal yang wajar, untuk pengembangan dan demo
  #   mock      -> nilai tetap yang bisa diskenariokan, untuk pengujian
  #
  # Config produksi WAJIB memakai lp_a104. Data simulasi tidak boleh pernah
  # tersaji sebagai data sungguhan — kapal yang mengirim data simulasi akan
  # tampak sehat sempurna di dashboard dan tidak akan ada yang menyadarinya.
  adapter: lp_a104
  sensors_path: /etc/fleetview/sensors.yaml
  poll_interval_seconds: 1.0
  poll_timeout_seconds: 5.0
  # Selisih antara jam dinding dan jam monotonic yang dianggap lompatan jam.
  clock_jump_threshold_seconds: 2.0
  backoff_initial_seconds: 1.0
  backoff_max_seconds: 60.0

storage:
  data_dir: /var/lib/fleetview
  outbox_path: /var/lib/fleetview/outbox.db
  influx_url: http://127.0.0.1:8086
  influx_org: fleetview
  influx_bucket: telemetry
  # influx_token: lewat FLEETVIEW_STORAGE__INFLUX_TOKEN, jangan ditulis di sini
  influx_timeout_seconds: 10.0

  # Umur simpan telemetry di InfluxDB lokal. 0 = tak terbatas, TIDAK dianjurkan
  # di kapal: disk penuh menghentikan akuisisi, dan itu kegagalan yang paling
  # merugikan karena terjadi diam-diam.
  retention_days: 90
  acked_grace_days: 7

  # Buffer percobaan ulang in-memory saat InfluxDB tidak tersedia.
  # Menangani: restart, compaction, lonjakan beban.
  # TIDAK menangani: mati listrik, dan InfluxDB mati berjam-jam — isinya hilang
  # saat proses berakhir. Durabilitas sesungguhnya menyusul di Phase 4 (outbox).
  # Pada 1 Hz dengan 80 sensor, 10.000 record kira-kira dua menit.
  buffer_max_records: 10000
  buffer_retry_batch_size: 500
  disk_warn_percent: 80.0
  disk_critical_percent: 90.0

sync:
  central_url: "https://fleetview.example.com"
  batch_max_records: 500
  batch_max_bytes: 1048576
  batch_max_age_seconds: 60
  heartbeat_interval_seconds: 60
  cellular_monthly_budget_mb: 500

console:
  enabled: true
  host: 127.0.0.1   # ubah ke 0.0.0.0 hanya bila Console perlu diakses dari LAN kapal
  port: 8080
