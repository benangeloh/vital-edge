<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Console{% endblock %} — {{ ship_name }}</title>
  <link rel="stylesheet" href="/static/console.css">
</head>
<body>
  <a href="#main" class="skip">Lompat ke konten</a>

  <header class="top">
    <div class="top__id">
      <span class="top__ship">{{ ship_name or "Edge Console" }}</span>
      <span class="top__meta mono">{{ ship_id }} · v{{ agent_version }}</span>
    </div>
    <span class="badge badge--{{ 'prod' if environment == 'production' else 'dev' }}">
      {{ environment }}
    </span>
  </header>

  <nav class="nav" aria-label="Navigasi console">
    {% for href, label in nav %}
      <a href="{{ href }}" class="nav__item{% if active == href %} nav__item--on{% endif %}"
         {% if active == href %}aria-current="page"{% endif %}>{{ label }}</a>
    {% endfor %}
  </nav>

  <main id="main" class="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">
    FleetView Edge Console · <a href="/api/status">status JSON</a>
  </footer>

  <!-- Penyegaran otomatis saja. Setiap halaman sudah lengkap tanpa skrip ini. -->
  <script src="/static/console.js" defer></script>
</body>
</html>
