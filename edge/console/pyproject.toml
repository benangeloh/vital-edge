[project]
name = "fleetview-edge-console"
version = "0.1.0"
description = "Edge Console — UI operasional ringan yang disajikan Edge Agent"
requires-python = ">=3.11"
dependencies = [
    "fleetview-common",
    "fastapi>=0.121",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetview_console"]
