[project]
name = "fleetview-simulator"
version = "0.1.0"
description = "Generator telemetry sintetis dan benchmark beban skala armada"
requires-python = ">=3.11"
dependencies = ["fleetview-contracts", "fleetview-common", "fleetview-edge-agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetview_simulator"]

[project.scripts]
fleetview-simulate = "fleetview_simulator.__main__:main"
