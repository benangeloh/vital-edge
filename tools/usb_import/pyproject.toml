[project]
name = "fleetview-usb-import"
version = "0.1.0"
description = "Impor paket ekspor USB dari kapal ke Central Platform"
requires-python = ">=3.11"
dependencies = ["fleetview-contracts", "fleetview-common", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetview_usb_import"]

[project.scripts]
fleetview-usb-import = "fleetview_usb_import.__main__:main"
