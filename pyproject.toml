[project]
name = "fleetview"
version = "0.1.0"
description = "FleetView — platform monitoring armada kapal SPIL (offline-first IoT telemetry)"
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "shared/contracts",
    "shared/common",
    "edge/agent",
    "edge/console",
    "central/api",
]

[tool.uv.sources]
fleetview-contracts = { workspace = true }
fleetview-common    = { workspace = true }
fleetview-edge-console = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    "types-PyYAML>=6.0",
    "asgi-lifespan>=2.1",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py311"
line-length = 100
src = [
    "shared/contracts/src",
    "shared/common/src",
    "edge/agent/src",
    "edge/console/src",
    "central/api/src",
]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetime — load-bearing for a system with clock-skew concerns
    "T20",       # no print()
    "SIM",       # simplify
    "PTH",       # pathlib over os.path
    "RUF",
]
ignore = [
    "E501",      # panjang baris sudah ditangani formatter
    # Dokumentasi dan pesan error ditulis dalam Bahasa Indonesia, yang memakai
    # en-dash dan tanda kutip tipografis secara sah. Ketiga aturan ini hanya
    # menghasilkan false positive di sini.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"shared/contracts/scripts/*" = ["T20"]   # skrip generator memang mencetak progres

[tool.ruff.lint.isort]
known-first-party = [
    "fleetview_contracts", "fleetview_common",
    "fleetview_edge", "fleetview_console", "fleetview_central",
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = [
    "shared/contracts/src",
    "shared/common/src",
    "edge/agent/src",
    "edge/console/src",
    "central/api/src",
]
explicit_package_bases = true
namespace_packages = true

# Berkas test dikecualikan dari disallow_untyped_defs. Bukan kelonggaran
# umum: fixture pytest sulit dianotasi dengan benar (tipe konkretnya sering
# hanya diketahui runtime), dan memaksakannya menghasilkan anotasi yang
# menyesatkan alih-alih menambah keamanan. Semua pemeriksaan strict lain tetap
# berlaku di test, termasuk pada kode produksi yang dipanggilnya.
#
# Catatan: pola mypy hanya menerima `*` sebagai satu komponen penuh, sehingga
# `test_*` tidak valid. Berkas test tetap tercakup lewat `conftest` dan lewat
# anotasi yang memang sudah lengkap di berkas test lainnya.
[[tool.mypy.overrides]]
module = ["tests.*", "*.tests.*", "conftest", "*.conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "shared/contracts/tests",
    "shared/common/tests",
    "edge/agent/tests",
    "edge/console/tests",
    "central/api/tests",
]
# importlib: monorepo ini punya beberapa test_settings.py di package berbeda.
# Mode import bawaan menurunkan nama modul dari nama berkas, jadi keduanya
# bentrok. importlib memakai path lengkap dan menghindari masalah itu tanpa
# perlu menyebar __init__.py ke setiap folder test.
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-ra",
]
markers = [
    "integration: butuh layanan eksternal (Postgres/InfluxDB) — dilewati secara default",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = [
    "shared/contracts/src",
    "shared/common/src",
    "edge/agent/src",
    "edge/console/src",
    "central/api/src",
]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
# Phase 1 hanya berisi foundation. Gate 80% dari rules diberlakukan mulai Phase 2,
# saat sudah ada logic yang layak diukur. Lihat docs/architecture/06-roadmap.md.
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
