[project]
name = "fleetview-common"
version = "0.1.0"
description = "Fondasi bersama: logging, taksonomi error, correlation ID, utilitas waktu"
requires-python = ">=3.11"
dependencies = ["structlog>=25.4", "uuid-utils>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetview_common"]
