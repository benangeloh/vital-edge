upstream fleetview_central {
    server api:8000;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=ingest:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=query:10m rate=30r/s;

server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/fleetview/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fleetview/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Kapal di balik satelit punya latensi tinggi dan jeda panjang, dan itu
    # berlaku ke SEMUA path API dari kapal (auth, query), bukan cuma ingest.
    # Batch terkompresi berukuran sekitar 1 MB; 8 MB memberi ruang untuk
    # potongan unggahan yang dilanjutkan setelah koneksi putus.
    client_max_body_size 8m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/health {
        access_log off;
        proxy_pass http://fleetview_central;
        include /etc/nginx/fleetview-proxy-headers.conf;
    }

    location /api/v1/ingest/ {
        limit_req zone=ingest burst=200 nodelay;
        limit_req_status 429;
        # client_max_body_size / proxy_*_timeout inherited from the server
        # block above (applies to every API path, not just ingest).
        proxy_pass http://fleetview_central;
        include /etc/nginx/fleetview-proxy-headers.conf;
    }

    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://fleetview_central;
        include /etc/nginx/fleetview-proxy-headers.conf;
    }

    location /api/ {
        limit_req zone=query burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://fleetview_central;
        include /etc/nginx/fleetview-proxy-headers.conf;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
