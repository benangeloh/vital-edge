[project]
name = "fleetview-central-api"
version = "0.1.0"
description = "FleetView Central Platform API — modular monolith"
requires-python = ">=3.11"
dependencies = [
    "fleetview-contracts",
    "fleetview-common",
    "fastapi>=0.121",
    "pydantic-settings>=2.11",
    "uvicorn[standard]>=0.38",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pyjwt>=2.10",
    "argon2-cffi>=25.1",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetview_central"]

[project.scripts]
fleetview-central = "fleetview_central.__main__:main"
fleetview-admin = "fleetview_central.admin:main"
