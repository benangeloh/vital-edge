# Terminasi TLS dan pembatasan laju untuk Central Platform.
#
# Kenapa di nginx dan bukan di kode aplikasi: pembatasan laju yang salah setel
# akan menolak data kapal yang sah, dan data yang ditolak berulang kali pada
# akhirnya menabrak batas percobaan di kapal lalu masuk karantina. Di nginx,
# angkanya bisa dinaikkan dengan reload tanpa deploy ulang — pada jam ketika 70
# kapal sekaligus menyetor backlog, selisih itu menentukan.

upstream fleetview_central {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Tiga zona terpisah, karena tiga bidang ini punya pola beban yang sangat berbeda.
#
# ingest: 70 kapal, masing-masing menyetor batch tiap beberapa detik, dan JAUH
# lebih deras saat sebuah kapal kembali online membawa backlog berminggu-minggu.
# Batasnya per-IP kapal, longgar, dan burst-nya besar dengan nodelay supaya
# lonjakan pemulihan tidak terhambat.
limit_req_zone $binary_remote_addr zone=ingest:10m rate=60r/s;

# auth: sasaran utama percobaan kredensial. Ketat.
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# query: dashboard operator, jumlahnya sedikit.
limit_req_zone $binary_remote_addr zone=query:10m rate=30r/s;

server {
    listen 80;
    server_name fleetview.example.com;
    # Satu-satunya hal yang dilayani lewat HTTP polos adalah pengalihan ke HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name fleetview.example.com;

    ssl_certificate     /etc/letsencrypt/live/fleetview.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fleetview.example.com/privkey.pem;

    # TLS 1.2 ke bawah tidak dilayani. Kapal memakai klien HTTP yang kita
    # kendalikan sendiri, jadi tidak ada peramban lama yang perlu diakomodasi.
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Batch terkompresi berukuran sekitar 1 MB. 8 MB memberi ruang untuk
    # potongan unggahan yang dilanjutkan setelah koneksi putus.
    client_max_body_size 8m;

    # Kapal di balik satelit punya latensi tinggi dan jeda panjang. Timeout
    # default nginx memutus unggahan yang sebenarnya masih berjalan.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location /api/v1/ingest/ {
        limit_req zone=ingest burst=200 nodelay;
        # 429, bukan 503. Sync Engine di kapal memperlakukan 429 sebagai bisa
        # dicoba ulang; kode lain bisa membuatnya menyerah dan mengarantina data
        # yang sebenarnya baik-baik saja.
        limit_req_status 429;
        proxy_pass http://fleetview_central;
        include /etc/nginx/fleetview-proxy-headers.conf;
    }

    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://fleetview_central;
        include /etc/nginx/fleetview-proxy-headers.conf;
    }

    # Health check tanpa pembatasan laju: pemantau yang ikut kena limit akan
    # melaporkan sistem sehat sebagai sistem mati.
    location = /api/health {
        access_log off;
        proxy_pass http://fleetview_central;
        include /etc/nginx/fleetview-proxy-headers.conf;
    }

    location / {
        limit_req zone=query burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://fleetview_central;
        include /etc/nginx/fleetview-proxy-headers.conf;
    }
}
