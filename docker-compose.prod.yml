name: fleetview-central

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleetview}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-fleetview}
    volumes:
      - ${FLEETVIEW_DATA_DIR:-/var/lib/fleetview}/postgres-data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleetview} -d ${POSTGRES_DB:-fleetview}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7-alpine
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: fleetview
      DOCKER_INFLUXDB_INIT_PASSWORD_FILE: /run/secrets/influx_password
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG:-fleetview}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_INIT_BUCKET:-telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE: /run/secrets/influx_token
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_INIT_RETENTION:-365d}
    volumes:
      - ${FLEETVIEW_DATA_DIR:-/var/lib/fleetview}/influx-data:/var/lib/influxdb2
    secrets:
      - influx_password
      - influx_token
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: central/api/Dockerfile
    image: fleetview-central-api:${FLEETVIEW_IMAGE_TAG:-local}
    working_dir: /app
    entrypoint: []
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    env_file:
      - ${FLEETVIEW_CENTRAL_ENV:-/etc/fleetview/central.env}
      - ${FLEETVIEW_SECRETS_ENV:-/etc/fleetview/secrets.env}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: central/api/Dockerfile
    image: fleetview-central-api:${FLEETVIEW_IMAGE_TAG:-local}
    env_file:
      - ${FLEETVIEW_CENTRAL_ENV:-/etc/fleetview/central.env}
      - ${FLEETVIEW_SECRETS_ENV:-/etc/fleetview/secrets.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: central/web/Dockerfile
    image: fleetview-central-web:${FLEETVIEW_IMAGE_TAG:-local}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${FLEETVIEW_CERTS_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - acme-challenge:/var/www/acme-challenge
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    # profiles excludes this service from a bare `up`/`up -d` — it only runs
    # when named explicitly (`docker compose run --rm certbot ...`, as
    # certbot-init.sh and certbot-renew.sh already do) or via `--profile
    # tools`. Without this, a bare `up -d` would create an argument-less
    # certbot container that exits non-zero (nothing to do without a
    # subcommand) every time the stack starts.
    profiles: ["tools"]
    volumes:
      - ${FLEETVIEW_CERTS_DIR:-/etc/letsencrypt}:/etc/letsencrypt
      - acme-challenge:/var/www/acme-challenge

volumes:
  acme-challenge:

secrets:
  postgres_password:
    file: ${FLEETVIEW_POSTGRES_PASSWORD_FILE:-/etc/fleetview/secrets/postgres_password.txt}
  influx_password:
    file: ${FLEETVIEW_INFLUX_PASSWORD_FILE:-/etc/fleetview/secrets/influx_password.txt}
  influx_token:
    file: ${FLEETVIEW_INFLUX_TOKEN_FILE:-/etc/fleetview/secrets/influx_token.txt}
